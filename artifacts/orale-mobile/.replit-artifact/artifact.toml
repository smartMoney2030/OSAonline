kind = "mobile"
previewPath = "/mobile/"
title = "Órale Mobile"
version = "1.0.0"
id = "artifacts/orale-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/mobile/" ]
localPort = 21470

[services.development]
run = "pnpm --filter @workspace/orale-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orale-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/orale-mobile", "run", "serve" ]

[services.env]
PORT = "21470"
BASE_PATH = "/mobile/"
