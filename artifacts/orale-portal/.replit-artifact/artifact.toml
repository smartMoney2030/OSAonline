kind = "web"
previewPath = "/"
title = "Órale World-Wide Portal"
version = "1.0.0"
id = "artifacts/orale-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21078

[services.development]
run = "pnpm --filter @workspace/orale-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orale-portal", "run", "build" ]
publicDir = "artifacts/orale-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21078"
BASE_PATH = "/"
