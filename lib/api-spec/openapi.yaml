openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Persistent object storage upload and serving endpoints
paths:
  /paying-forward/ads:
    get:
      operationId: getPayingForwardAds
      summary: Active Paying Forward advertisements
      responses:
        "200":
          description: Advertisements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayingForwardAd"
  /paying-forward/applications:
    post:
      operationId: submitPayingForwardApplication
      summary: Save a business application and notify the team by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayingForwardApplicationInput"
      responses:
        "201":
          description: Application saved; notificationSent indicates email delivery
          content:
            application/json:
              schema:
                type: object
                required: [id, notificationSent]
                properties:
                  id:
                    type: integer
                  notificationSent:
                    type: boolean
        "400":
          description: Invalid application
        "429":
          description: Too many applications
  /admin/paying-forward/ads:
    get:
      operationId: getAdminPayingForwardAds
      responses:
        "200":
          description: All advertisements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayingForwardAd"
    post:
      operationId: createPayingForwardAd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayingForwardAdInput"
      responses:
        "201":
          description: Created advertisement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayingForwardAd"
  /admin/paying-forward/ads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      operationId: updatePayingForwardAd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayingForwardAdInput"
      responses:
        "200":
          description: Updated advertisement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayingForwardAd"
    delete:
      operationId: deletePayingForwardAd
      responses:
        "204":
          description: Deleted advertisement
  /admin/paying-forward/applications:
    get:
      operationId: getAdminPayingForwardApplications
      responses:
        "200":
          description: Applications, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayingForwardApplication"
  /admin/paying-forward/applications/{id}/notify:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: notifyPayingForwardApplication
      summary: Send an unsent application to the team
      responses:
        "200":
          description: Notification sent
        "503":
          description: Email unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for an image upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Admin authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve a persistently stored image
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image content
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Image not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  schemas:
    PayingForwardAdInput:
      type: object
      required: [title, imageUrl, linkUrl, isActive, sortOrder]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        imageUrl:
          type: string
          minLength: 1
          maxLength: 2000
        linkUrl:
          type: string
          maxLength: 2000
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
    PayingForwardAd:
      allOf:
        - $ref: "#/components/schemas/PayingForwardAdInput"
        - type: object
          required: [id]
          properties:
            id:
              type: integer
    PayingForwardApplicationInput:
      type: object
      required: [businessName, ownerName, phone, hasWebsite, websiteUrl, services, address, city, state, zipCode, comments]
      properties:
        businessName:
          type: string
          minLength: 1
          maxLength: 200
        ownerName:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: string
          minLength: 10
          maxLength: 30
        hasWebsite:
          type: boolean
        websiteUrl:
          type: string
          maxLength: 2000
        services:
          type: string
          minLength: 1
          maxLength: 5000
        address:
          type: string
          minLength: 1
          maxLength: 300
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 2
          maxLength: 50
        zipCode:
          type: string
          minLength: 5
          maxLength: 10
        comments:
          type: string
          maxLength: 5000
        companyFax:
          type: string
          description: Leave empty; spam protection
    PayingForwardApplication:
      allOf:
        - $ref: "#/components/schemas/PayingForwardApplicationInput"
        - type: object
          required: [id, notificationSent, createdAt]
          properties:
            id:
              type: integer
            notificationSent:
              type: boolean
            createdAt:
              type: string
              format: date-time
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

